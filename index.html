<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accès au site</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e3a5f 0%, #0f1f33 100%);
    padding: 20px;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  }

  .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #eaf1fb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  h1 {
    font-size: 22px;
    color: #12233c;
    margin-bottom: 12px;
  }

  p {
    color: #56657a;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    background: #1e3a5f;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  button:hover {
    background: #16304f;
  }

  .note {
    margin-top: 20px;
    font-size: 12px;
    color: #9aa5b1;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon">🔒</div>
  <h1>Autorisation d'accès requise</h1>
  <p>
    En cliquant sur « J'accepte / Continuer », vous confirmez être autorisé(e)
    à accéder au contenu de ce site.
  </p>
  <button onclick="window.location.href='contenu.html'">J'accepte / Continuer</button>
  <p class="note">Vous serez redirigé(e) automatiquement.</p>
</div>

</body>
</html>
